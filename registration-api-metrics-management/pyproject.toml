[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "registration-api-metrics"
version = "0.0.1"
description = "registration-api-metrics analyzer"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["geospatial", "registration", "resource"]
authors = [
    {name = "Angelos Tzotsos", email = "tzotsos@gmail.com"},
    {name = "Tom Kralidis", email = "tomkralidis@gmail.com"}
]
maintainers = [
    {name = "Angelos Tzotsos", email = "tzotsos@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
    "Click",
    "paho-mqtt",
    "requests"
]

[project.optional-dependencies]
dev = ["flake8"]
docs = ["zensical"]
release = ["build", "twine", "wheel"]

[project.scripts]
registration-api-metrics = "registration_api_metrics:cli"

[project.urls]
homepage = "https://github.com/EOEPCA/registration-api-metrics"
source = "https://github.com/EOEPCA/registration-api-metrics"
documentation = "https://github.com/EOEPCA/registration-api-metrics"
issues = "https://github.com/EOEPCA/registration-api-metrics/issues"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["docker", "Dockerfile"]
